<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="vouchr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFF7ED" />
    </linearGradient>
    <linearGradient id="vouchr-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="vouchr-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <clipPath id="hero-circle-clip">
      <circle cx="1200" cy="420" r="320" />
    </clipPath>
    <clipPath id="pro-card-1">
      <rect x="940" y="220" width="220" height="240" rx="24" />
    </clipPath>
    <clipPath id="pro-card-2">
      <rect x="1190" y="160" width="230" height="260" rx="24" />
    </clipPath>
    <clipPath id="pro-card-3">
      <rect x="990" y="490" width="240" height="240" rx="24" />
    </clipPath>
    <clipPath id="pro-card-4">
      <rect x="1260" y="450" width="220" height="250" rx="24" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Space Grotesk', monospace; }
  </style>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#vouchr-bg)" />

  <!-- Soft decorative yellow backdrop blob -->
  <circle cx="1240" cy="420" r="360" fill="#FEF08A" opacity="0.6" />
  <circle cx="1380" cy="320" r="220" fill="#FDE047" opacity="0.4" />

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <rect x="0" y="0" width="1600" height="96" fill="#FFFFFF" />
  <line x1="0" y1="96" x2="1600" y2="96" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Vouchr Logo -->
  <g transform="translate(80, 26)">
    <!-- Logo Icon -->
    <rect x="0" y="4" width="38" height="38" rx="10" fill="url(#vouchr-orange)" />
    <path d="M11 22 L17 28 L28 15" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Logo Text -->
    <text x="50" y="32" class="font-sans" font-size="28" font-weight="900" fill="#FF6B00" letter-spacing="-0.5">vouchr</text>
    <text x="52" y="45" class="font-sans" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1.5">TECHNOLOGIES LIMITED</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(580, 54)" class="font-sans" font-size="16" font-weight="600" fill="#334155">
    <text x="0" y="0" cursor="pointer">About Us</text>
    <text x="120" y="0" cursor="pointer">Contact Us</text>
  </g>

  <!-- Nav Right CTA -->
  <g transform="translate(1360, 24)">
    <rect x="0" y="0" width="160" height="48" rx="24" fill="url(#vouchr-orange)" filter="url(#drop-shadow)" />
    <text x="80" y="30" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get the App</text>
  </g>

  <!-- ================= HERO LEFT CONTENT ================= -->
  <g transform="translate(80, 160)">
    <!-- Badges Strip -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="460" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
      <!-- Badge 1: Verified Identity -->
      <g transform="translate(16, 12)">
        <circle cx="8" cy="7" r="7" fill="#10B981" />
        <path d="M5 7 L7 9 L11 5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <text x="20" y="11" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">Verified Identity</text>
      </g>
      <!-- Separator dot -->
      <circle cx="156" cy="19" r="2.5" fill="#CBD5E1" />
      <!-- Badge 2: Rated & Reviewed -->
      <g transform="translate(172, 12)">
        <polygon points="8,1 10,6 15,6 11,9 13,14 8,11 3,14 5,9 1,6 6,6" fill="#F59E0B" />
        <text x="20" y="11" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">Rated &amp; Reviewed</text>
      </g>
      <!-- Separator dot -->
      <circle cx="316" cy="19" r="2.5" fill="#CBD5E1" />
      <!-- Badge 3: Escrow Protected -->
      <g transform="translate(330, 12)">
        <rect x="3" y="6" width="10" height="8" rx="2" fill="#3B82F6" />
        <path d="M5 6 V4 A3 3 0 0 1 11 4 V6" stroke="#3B82F6" stroke-width="1.5" fill="none" />
        <text x="18" y="11" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">Escrow Protected</text>
      </g>
    </g>

    <!-- Main Headline -->
    <text x="0" y="110" class="font-sans" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      <tspan x="0" dy="0">Find Your Trusted</tspan>
      <tspan x="0" dy="68">Local Services Fast</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="270" class="font-sans" font-size="18" font-weight="500" fill="#64748B" width="580">
      <tspan x="0" dy="0">Connect with verified providers near you. From home fixes to</tspan>
      <tspan x="0" dy="30">business support, get reliable, trusted, and guaranteed services.</tspan>
    </text>

    <!-- App Store Download Buttons -->
    <g transform="translate(0, 360)">
      <!-- Google Play Button -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="56" rx="14" fill="#000000" filter="url(#drop-shadow)" />
        <!-- Play Icon -->
        <g transform="translate(18, 14)">
          <path d="M4 4 L20 14 L4 24 Z" fill="#34A853" />
          <path d="M4 4 L14 14 L4 24 Z" fill="#4285F4" />
          <path d="M14 14 L20 14 L4 24 Z" fill="#EA4335" />
          <path d="M4 4 L20 14 L14 14 Z" fill="#FBBC04" />
        </g>
        <text x="54" y="23" class="font-sans" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.5">GET IT ON</text>
        <text x="54" y="41" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">Google Play</text>
      </g>

      <!-- Apple App Store Button -->
      <g transform="translate(208, 0)">
        <rect x="0" y="0" width="205" height="56" rx="14" fill="#000000" filter="url(#drop-shadow)" />
        <!-- Apple Icon -->
        <g transform="translate(18, 13)">
          <path d="M16 14 C16 9 20 7 20 7 C18 4 15 3 13 3 C10 3 8 5 6 5 C4 5 2 3 0 3 C-2 3 -4 6 -4 11 C-4 15 -2 19 0 22 C1 24 3 26 5 26 C7 26 8 25 10 25 C12 25 13 26 15 26 C17 26 19 24 20 22 C20 22 16 20 16 14 Z" fill="#FFFFFF" transform="scale(0.8) translate(8, 2)" />
        </g>
        <text x="54" y="23" class="font-sans" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.5">Download on the</text>
        <text x="54" y="41" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">App Store</text>
      </g>
    </g>

    <!-- Social Proof Metrics Strip -->
    <g transform="translate(0, 460)">
      <g transform="translate(0, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="900" fill="#FF6B00">10,000+</text>
        <text x="0" y="46" class="font-sans" font-size="13" font-weight="600" fill="#64748B">Verified Providers</text>
      </g>
      <line x1="145" y1="6" x2="145" y2="48" stroke="#E2E8F0" stroke-width="1.5" />
      <g transform="translate(170, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="900" fill="#0F172A">4.9 / 5.0</text>
        <text x="0" y="46" class="font-sans" font-size="13" font-weight="600" fill="#64748B">Customer Satisfaction</text>
      </g>
      <line x1="330" y1="6" x2="330" y2="48" stroke="#E2E8F0" stroke-width="1.5" />
      <g transform="translate(355, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="900" fill="#10B981">100%</text>
        <text x="0" y="46" class="font-sans" font-size="13" font-weight="600" fill="#64748B">Milestone Escrow</text>
      </g>
    </g>
  </g>

  <!-- ================= HERO RIGHT VISUAL COLLAGE ================= -->
  <!-- Pro Card 1: Electrician / Tradeswoman -->
  <g clip-path="url(#pro-card-1)" filter="url(#drop-shadow)">
    <rect x="940" y="220" width="220" height="240" fill="#1E293B" />
    <radialGradient id="electrician-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <rect x="940" y="220" width="220" height="240" fill="url(#electrician-grad)" />
    <!-- Stylized Pro Silhouette & Tool -->
    <circle cx="1050" cy="300" r="42" fill="#FED7AA" />
    <rect x="1025" y="270" width="50" height="20" rx="10" fill="#F97316" />
    <path d="M1000 380 C1000 330 1100 330 1100 380 Z" fill="#0284C7" />
    <!-- Label Pill -->
    <rect x="955" y="415" width="130" height="28" rx="14" fill="#000000" opacity="0.75" />
    <text x="1020" y="434" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Electrical Tech</text>
  </g>

  <!-- Pro Card 2: Builder / Construction Specialist in Yellow Hardhat -->
  <g clip-path="url(#pro-card-2)" filter="url(#drop-shadow)">
    <rect x="1190" y="160" width="230" height="260" fill="#F8FAFC" />
    <radialGradient id="builder-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </radialGradient>
    <rect x="1190" y="160" width="230" height="260" fill="url(#builder-grad)" />
    <!-- Yellow Hardhat Construction silhouette -->
    <path d="M1280 230 C1280 205 1330 205 1330 230 Z" fill="#EAB308" />
    <circle cx="1305" cy="250" r="38" fill="#FDBA74" />
    <path d="M1260 350 C1260 295 1350 295 1350 350 Z" fill="#1E293B" />
    <!-- High-vis vest stripes -->
    <rect x="1285" y="305" width="40" height="50" fill="#84CC16" />
    <!-- Label Pill -->
    <rect x="1205" y="375" width="140" height="28" rx="14" fill="#000000" opacity="0.75" />
    <text x="1275" y="394" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Home Renovation</text>
  </g>

  <!-- Pro Card 3: Professional Cleaner -->
  <g clip-path="url(#pro-card-3)" filter="url(#drop-shadow)">
    <rect x="990" y="490" width="240" height="240" fill="#F0FDF4" />
    <radialGradient id="clean-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BBF7D0" />
      <stop offset="100%" stop-color="#16A34A" />
    </radialGradient>
    <rect x="990" y="490" width="240" height="240" fill="url(#clean-grad)" />
    <circle cx="1110" cy="570" r="40" fill="#FED7AA" />
    <path d="M1065 670 C1065 615 1155 615 1155 670 Z" fill="#047857" />
    <!-- Spray Bottle & cloth -->
    <rect x="1140" y="610" width="22" height="38" rx="6" fill="#FACC15" />
    <rect x="1005" y="685" width="130" height="28" rx="14" fill="#000000" opacity="0.75" />
    <text x="1070" y="704" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pro Cleaning</text>
  </g>

  <!-- Pro Card 4: Courier / Delivery Specialist -->
  <g clip-path="url(#pro-card-4)" filter="url(#drop-shadow)">
    <rect x="1260" y="450" width="220" height="250" fill="#FFF7ED" />
    <radialGradient id="courier-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <rect x="1260" y="450" width="220" height="250" fill="url(#courier-grad)" />
    <circle cx="1370" cy="530" r="38" fill="#FDBA74" />
    <!-- Helmet -->
    <circle cx="1370" cy="520" r="40" fill="#C2410C" />
    <path d="M1325 640 C1325 585 1415 585 1415 640 Z" fill="#9A3412" />
    <!-- Delivery parcel box -->
    <rect x="1350" y="585" width="40" height="32" rx="4" fill="#D97706" />
    <rect x="1275" y="655" width="130" height="28" rx="14" fill="#000000" opacity="0.75" />
    <text x="1340" y="674" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fast Dispatch</text>
  </g>

  <!-- Floating Trust Badge -->
  <g transform="translate(860, 420)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="220" height="66" rx="20" fill="#FFFFFF" />
    <circle cx="34" cy="33" r="20" fill="#10B981" />
    <path d="M26 33 L32 39 L43 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="64" y="28" class="font-sans" font-size="13" font-weight="800" fill="#0F172A">Verified Identity</text>
    <text x="64" y="46" class="font-sans" font-size="11" font-weight="600" fill="#10B981">Government ID Checked</text>
  </g>

  <!-- Floating Escrow Card -->
  <g transform="translate(1330, 360)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="200" height="66" rx="20" fill="#0F172A" />
    <circle cx="34" cy="33" r="18" fill="url(#vouchr-orange)" />
    <!-- Lock Icon -->
    <rect x="29" y="30" width="10" height="8" rx="2" fill="#FFFFFF" />
    <path d="M31 30 V27 A3 3 0 0 1 37 27 V30" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="60" y="27" class="font-sans" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">ESCROW VAULT</text>
    <text x="60" y="47" class="font-sans" font-size="14" font-weight="800" fill="#FFFFFF">Funds Protected</text>
  </g>

  <!-- ================= LOWER SECTION PREVIEW ================= -->
  <!-- Golden Banner: How it Works & Why Join -->
  <rect x="0" y="780" width="1600" height="220" fill="#FBBF24" />
  <rect x="80" y="805" width="1440" height="150" rx="24" fill="#FFFFFF" filter="url(#drop-shadow)" />

  <g transform="translate(120, 835)">
    <text x="0" y="24" class="font-sans" font-size="12" font-weight="800" fill="#F59E0B" letter-spacing="1.5">HOW VOUCHR WORKS</text>
    <text x="0" y="58" class="font-sans" font-size="24" font-weight="900" fill="#0F172A">4 Simple Steps to Trust</text>
  </g>

  <!-- 4 Process steps -->
  <g transform="translate(480, 835)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="20" r="18" fill="#FFF7ED" stroke="#FF6B00" stroke-width="2" />
      <text x="20" y="26" class="font-sans" font-size="14" font-weight="800" fill="#FF6B00" text-anchor="middle">1</text>
      <text x="50" y="18" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">Search Services</text>
      <text x="50" y="36" class="font-sans" font-size="12" font-weight="500" fill="#64748B">Find verified pros nearby</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(240, 0)">
      <circle cx="20" cy="20" r="18" fill="#FFF7ED" stroke="#FF6B00" stroke-width="2" />
      <text x="20" y="26" class="font-sans" font-size="14" font-weight="800" fill="#FF6B00" text-anchor="middle">2</text>
      <text x="50" y="18" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">Compare &amp; Book</text>
      <text x="50" y="36" class="font-sans" font-size="12" font-weight="500" fill="#64748B">Transparent pricing &amp; reviews</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(490, 0)">
      <circle cx="20" cy="20" r="18" fill="#FFF7ED" stroke="#FF6B00" stroke-width="2" />
      <text x="20" y="26" class="font-sans" font-size="14" font-weight="800" fill="#FF6B00" text-anchor="middle">3</text>
      <text x="50" y="18" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">Pay Securely</text>
      <text x="50" y="36" class="font-sans" font-size="12" font-weight="500" fill="#64748B">Escrow holds funds safely</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(730, 0)">
      <circle cx="20" cy="20" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
      <text x="20" y="26" class="font-sans" font-size="14" font-weight="800" fill="#10B981" text-anchor="middle">4</text>
      <text x="50" y="18" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">Rate &amp; Release</text>
      <text x="50" y="36" class="font-sans" font-size="12" font-weight="500" fill="#64748B">Release funds on satisfaction</text>
    </g>
  </g>
</svg>